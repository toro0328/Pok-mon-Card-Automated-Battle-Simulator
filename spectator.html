<body>
<header><strong>ポケカ対戦試験</strong><a href="./index.html">手動対戦へ</a><a href="./deck-import.html">デッキ読み込みページへ</a></header>
<main>
<section class="panel">
<h1>AI同士の自動対戦</h1>
<p class="help">2つの公式デッキコードを読み込み、カードごとの特性・ワザ・効果を解析してからAI対戦します。手は約1〜1.5秒ごとに進みます。公式ページのCORS制限時は公開中継サービス経由で読み込みます。</p>
<div class="codes">
<div><label for="codeA">自分側のデッキコード / URL</label><input id="codeA" placeholder="6文字-6文字-6文字"></div>
<div><label for="codeB">相手側のデッキコード / URL</label><input id="codeB" placeholder="6文字-6文字-6文字"></div>
</div>
<div class="controls" style="margin-top:10px">
<button id="load">2デッキを読み込んで対戦準備</button>
<button id="start" disabled>自動対戦スタート</button>
<button id="pause" disabled>一時停止</button>
</div>
<div id="load-progress" hidden><progress id="progress-bar" max="100" value="0"></progress><span id="progress-label">0%</span><small id="elapsed">経過 0秒</small></div>
<p id="status" role="status">コードを入力してください。以前読み込んだデッキは入力欄に表示されます。</p>
</section>
<div class="panel controls"><strong id="turn">対戦準備前</strong><span id="seed"></span></div>
<section class="players">
<div id="player1" class="player opponent"></div><div id="player0" class="player"></div>
</section>
<section id="analysis-panel" class="panel" hidden><h2>デッキ解析</h2><p id="analysis-summary" class="help"></p><p id="strategy-summary" class="help"></p><div id="analysis-list" class="analysis-list"></div></section>
<section class="panel"><h2>直近の行動</h2><div id="log" class="log"><div>対戦ログはここに表示されます。</div></div></section>
</main>
<script type="module">

  pause:document.getElementById("pause"),status:document.getElementById("status"),
  progress:document.getElementById("load-progress"),progressBar:document.getElementById("progress-bar"),progressLabel:document.getElementById("progress-label"),elapsed:document.getElementById("elapsed"),
  analysisPanel:document.getElementById("analysis-panel"),analysisSummary:document.getElementById("analysis-summary"),strategySummary:document.getElementById("strategy-summary"),analysisList:document.getElementById("analysis-list"),turn:document.getElementById("turn"),
  seed:document.getElementById("seed"),p0:document.getElementById("player0"),

let repository,engine,game,names=["自分側","相手側"],timer=null,running=false,moveCount=0,entries=[],analysisByPlayer=[],analysisAllowsMatch=false,loadStarted=0,loadClock=null;
const delay=()=>1000+Math.floor(Math.random()*501);
function setStatus(message,kind=""){el.status.textContent=message;el.status.className=kind;}
function updateProgress(percent,label){el.progress.hidden=false;el.progressBar.value=percent;el.progressLabel.textContent=Math.round(percent)+"%　"+label;const seconds=Math.max(0,Math.floor((Date.now()-loadStarted)/1000));el.elapsed.textContent="経過 "+seconds+"秒"+(percent<55?"・公式ページ取得時間は回線により変わります":"");}
function parseCode(value){
  const match=value.trim().match(/[A-Za-z0-9]{6}-[A-Za-z0-9]{6}-[A-Za-z0-9]{6}/);
  if(!match)throw new Error("デッキコードは 6文字-6文字-6文字 の形式で入力してください。");
  return match[0];
}
function parseOfficialDeck(html){
  const doc=new DOMParser().parseFromString(html,"text/html"),cards=new Map();
  for(const field of ["deck_pke","deck_gds","deck_tool","deck_sup","deck_sta","deck_ene"]){
    const input=doc.getElementById(field);if(!input)continue;
    const value=input.value||input.getAttribute("value")||"";
    for(const m of value.matchAll(/(\d{5})_(\d+)_([19])/g)){
      const id=Number(m[1]),count=Number(m[2]);
      if(!count||count>60)continue;
      cards.set(id,(cards.get(id)??0)+count);
    }
  }
  return [...cards].map(([officialCardId,count])=>({officialCardId,count}));
}
async function readDeck(input,slot){
  const saved=JSON.parse(localStorage.getItem(`pokemon-card-simulator-deck-${slot}`)||"null");
  const typed=input.trim()?parseCode(input):null;
  if(saved&&(!typed||saved.deckCode===typed))return saved;
  if(!typed)throw new Error("2つのデッキコードを入力してください。");
  const code=typed,officialUrl=`https://www.pokemon-card.com/deck/confirm.html/deckID/${code}/`;
  let html,lastError;
  for(const url of [officialUrl,`https://api.allorigins.win/raw?url=${encodeURIComponent(officialUrl)}`]){
    try{const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw Error(`HTTP ${response.status}`);
      html=await response.text();if(html.length<300)throw Error("応答が短すぎます");break;
    }catch(error){lastError=error;}
  }
  if(!html)throw new Error(`${code} を公式サイトから取得できませんでした（${lastError?.message??"接続エラー"}）。公式ページの公開設定やCORS制限を確認してください。`);
  const cards=parseOfficialDeck(html),total=cards.reduce((sum,x)=>sum+x.count,0);
  if(!cards.length)throw new Error(`${code} のカード一覧を読み取れません。公式ページの形式変更または非公開デッキの可能性があります。`);
  if(total!==60)throw new Error(`${code} は${total}枚として読み取られました。60枚デッキを指定してください。`);
  const missing=cards.filter(x=>!repository.get(x.officialCardId));
  if(missing.length)throw new Error(`${code} は読み込めましたが、カードDB未登録IDがあります：${missing.map(x=>x.officialCardId).join("、")}`);
  const deck={name:`公式デッキ ${code}`,deckCode:code,sourceUrl:officialUrl,cards};
  localStorage.setItem(`pokemon-card-simulator-deck-${slot}`,JSON.stringify(deck));
  return deck;
}
function card(id){return repository.get(id);}
function instanceById(id){
  if(!id)return null;
  for(const p of game.players){
    const piles=[p.hand,p.deck,p.prizes,p.trash,p.bench,p.active?[p.active]:[]];
    for(const pile of piles)for(const x of pile??[]){
      if(x.instanceId===id)return x;
      for(const nested of [...(x.attached??[]),...(x.stack??[])])if(nested.instanceId===id)return nested;
    }
  }
  return null;
}
function energyText(pokemon){
  return (pokemon.attached??[]).map(x=>card(x.cardId).name).join("・")||"なし";
}
function cardView(pokemon){
  if(!pokemon)return Object.assign(document.createElement("span"),{className:"empty",textContent:"空き"});
  const node=document.createElement("div");node.className="pokemon";
  node.append(document.createTextNode(card(pokemon.cardId).name));
  const small=document.createElement("small");
  small.textContent=`HP ${engine.effectiveHP(pokemon)} / ダメージ ${pokemon.damage??0}・エネ ${energyText(pokemon)}`;
  node.append(small);return node;
}
function playerView(index){
  const p=game.players[index],root=index===0?el.p0:el.p1;root.replaceChildren();
  const title=document.createElement("h2");
  title.textContent=`${names[index]}　山札${p.deck.length}・手札${p.hand.length}・サイド${p.prizes.length}・トラッシュ${p.trash.length}`;
  root.append(title);
  const active=document.createElement("div");active.className="active";active.append(cardView(p.active));root.append(active);
  const bench=document.createElement("div");bench.className="bench";
  for(let i=0;i<5;i++){const slot=document.createElement("div");slot.className="slot";slot.append(cardView(p.bench[i]));bench.append(slot);}
  root.append(bench);
  const info=document.createElement("div");info.className="info";
  info.textContent=`バトル場：${p.active?card(p.active.cardId).name:"なし"}${p.active?.statuses?.length?` ／ 状態 ${p.active.statuses.map(x=>typeof x==="string"?x:x.name).join("・")}`:""}`;
  root.append(info);
  const hand=document.createElement("div");hand.className="hand";
  for(const x of p.hand){const chip=document.createElement("span");chip.textContent=card(x.cardId).name;hand.append(chip);}
  if(!p.hand.length){const chip=document.createElement("span");chip.textContent="手札なし";hand.append(chip);}
  root.append(hand);
}
function actionCard(id){const x=instanceById(id);return x?card(x.cardId).name:"";}
function describe(action){
  const who=names[action.player??game.turn]??"AI";
  const source=action.sourceInstanceId?actionCard(action.sourceInstanceId):"";
  const choice=action.choiceInstanceId?actionCard(action.choiceInstanceId):"";
  const target=action.targetInstanceId?actionCard(action.targetInstanceId):"";
  const labels={
    SET_ACTIVE:`バトル場に ${source} を出す`,SET_BENCH:`ベンチに ${source} を出す`,
    READY_SETUP:"初期配置を完了",BENCH_BASIC:`ベンチに ${source} を出す`,
    ATTACH_ENERGY:`${source} を ${target} につける`,ATTACH_TOOL:`${source} を ${target} につける`,DISCARD_EXCESS_BENCH:`${source} をベンチ上限調整でトラッシュ`,TRAINER_GLASS_ATTACH:`${choice} を ${target} につける`,EVOLVE:`${target} を ${source} に進化`,
    RETREAT:`${source} がにげる`,END_TURN:"番を終える",
    USE_ABILITY:`${source} の特性を使う`,ATTACK:`${source} のワザを使う`,
    PLAY_TRAINER:`${source} を使う`,PLAY_STADIUM:`${source} を場に出す`,
    TAKE_PRIZE:"サイドを取る",PROMOTE_BENCH:`${source||target} をバトル場へ`,
    RESOLVE_KNOCKOUT:"きぜつ処理を完了",TRAINER_SELECT:`${choice} を選ぶ`,
    TRAINER_DISCARD:`${choice} をトラッシュ`,TRAINER_FINISH:"山札を切って効果を終了",
    ATTACK_SEARCH:`${choice} をワザの効果で選ぶ`,ATTACK_SEARCH_FINISH:"ワザの効果を終了",
    ATTACK_DISCARD_ENERGY:`${choice} をトラッシュ`,ATTACK_PROMOTE:`${target} をバトル場へ`,
    ABILITY_SELECT:`${choice} を特性で選ぶ`,ABILITY_SKIP:"特性の選択を終了",
    AKAMATSU_PICK:`${choice} をアカマツで選ぶ`,AKAMATSU_HAND:`${choice} を手札に加える`,
    AKAMATSU_ATTACH:`${target} にエネルギーをつける`,AKAMATSU_FINISH:"アカマツを終了"

function score(action,actions){
  const state=game;
  if(state.phase==="setup"){
    const player=state.players[action.player];
    const hasBench=actions.some(x=>x.player===action.player&&x.type==="SET_BENCH");
    if(action.type==="SET_ACTIVE")return 120;
    if(action.type==="SET_BENCH")return player.bench.length<2?100:15;
    if(action.type==="READY_SETUP")return hasBench?10:80;
  }
  const base={
    TAKE_PRIZE:120,PROMOTE_BENCH:118,RESOLVE_KNOCKOUT:117,
    TRAINER_DISCARD:116,TRAINER_SELECT:112,AKAMATSU_PICK:112,AKAMATSU_HAND:111,
    AKAMATSU_ATTACH:110,TRAINER_GLASS_ATTACH:110,ATTACK_SEARCH:110,ATTACK_DISCARD_ENERGY:110,ATTACK_PROMOTE:110,
    ABILITY_SELECT:109,ABILITY_SKIP:30,TRAINER_FINISH:25,AKAMATSU_FINISH:25,ATTACK_SEARCH_FINISH:25,
    EVOLVE:84,USE_ABILITY:74,USE_HOOH:76,ATTACH_ENERGY:68,ATTACH_TOOL:66,
    PLAY_TRAINER:61,PLAY_STADIUM:45,BENCH_BASIC:42,RETREAT:32,ATTACK:54,END_TURN:0
  }[action.type]??20;
  if(action.type==="ATTACH_ENERGY"){
    const target=instanceById(action.targetInstanceId),energy=instanceById(action.sourceInstanceId),attacks=target?engine.attacks(target).filter(x=>x.status==="supported"):[],after=target?{...target,attached:[...(target.attached??[]),energy].filter(Boolean)}:null,enables=after&&attacks.some(x=>engine.energyPaysCost(after,x.cost)),already=target&&attacks.some(x=>engine.energyPaysCost(target,x.cost)),active=target?.instanceId===game.players[action.player].active?.instanceId,damage=analysisByPlayer[action.player]?.attackerIds.find(x=>x.id===target?.cardId)?.damage??0;
    return base+(active?8:Math.min(18,damage/18))+(enables&&!already?18:0);
  }
  if(action.type==="ATTACK"){
    let amount=0;
    try{amount=engine.calculateAttackDamage(state,action);}catch{}
    const opponent=state.players[1-action.player];
    const target=action.targetInstanceId?[...opponent.bench,opponent.active].find(x=>x?.instanceId===action.targetInstanceId):opponent.active;
    const ko=target&&amount+(target.damage??0)>=engine.effectiveHP(target);
    return base+Math.min(amount,300)/20+(ko?40:0);
  }
  if(action.type==="RETREAT")return state.players[action.player].active?.statuses?.length?base+15:base;
  if(action.type==="BENCH_BASIC"&&game.players[action.player].bench.length>=engine.maxBenchCount(game,action.player)-1)return base-15;
  if(action.type==="DISCARD_EXCESS_BENCH"){const card=instanceById(action.sourceInstanceId),raw=card?engine.card(card).raw:{},damage=card?Math.max(0,...engine.attacks(card).filter(x=>x.status==="supported").map(x=>x.printedDamage?.amount??0)):0;return 5-damage/20-(card&&engine.isTeraPokemon(card)?100:0);}
  return base;
}
function roleTags(text){
  const roles=[];
  for(const [pattern,label] of [[/山札|引く|手札/,"ドロー・サーチ"],[/エネルギー/,"エネルギー加速"],[/ダメージ|ダメカン|きぜつ/,"ダメージ"],[/ベンチ|場に出す/,"ベンチ展開"],[/入れ替|にげる|バトルポケモン/,"移動・呼び出し"],[/回復|HP/,"回復"],[/トラッシュ/,"トラッシュ操作"]])if(pattern.test(text)&&!roles.includes(label))roles.push(label);
  return roles;
}
function analyzeCard(officialCardId){
  const data=repository.get(officialCardId),ref={cardId:officialCardId},checks=[],details=[],texts=[];
  if(data.cardType==="pokemon"){
    const abilities=engine.entries(ref),attacks=engine.attacks(ref);
    for(const ability of abilities){checks.push(ability.status==="supported");details.push({label:"特性："+ability.name,status:ability.status,text:ability.text});texts.push(ability.text||"");}
    for(const attack of attacks){checks.push(attack.status==="supported");details.push({label:"ワザ："+attack.name+"（"+(attack.cost||[]).join("・")+"／"+(attack.printedDamage?.amount??"効果")+"）",status:attack.status,text:attack.text});texts.push(attack.text||"");}
    if(!checks.length)checks.push(true);
  }else if(data.cardType==="trainer"){
    const ok=data.trainerType==="stadium"?engine.isSupportedStadium(ref):data.trainerType==="tool"?engine.isSupportedTool(ref):!!engine.trainerSpec(ref);checks.push(ok);const text=data.name==="ガラスのラッパ"&&ok?"公式カード文（DB記載を補正）：\n"+engine.trainerSpec(ref).text+"\nDB原文（Colorless限定の誤記）：\n"+(data.raw.effect||""):data.raw.effect||"テキスト登録なし";details.push({label:data.trainerType||"トレーナーズ",status:ok?"supported":"needs_review",text});texts.push(text);
  }else if(data.cardType==="energy"){
    const ok=engine.isSupportedEnergy(ref);checks.push(ok);details.push({label:data.energyType==="basic"?"基本エネルギー":"特殊エネルギー",status:ok?"supported":"needs_review",text:data.raw.effect||""});texts.push(data.raw.effect||"");
  }else{checks.push(data.engine?.status==="supported");details.push({label:data.cardType||"カード",status:data.engine?.status||"needs_review",text:data.raw.effect||""});}

  return {officialCardId,name:data.name,type:data.cardType,details,roles,supported:checks.every(Boolean),bestDamage:Math.max(0,...engine.attacks(ref).filter(x=>x.status==="supported").map(x=>x.printedDamage?.amount??0))};
}
function addAnalysisCard(report,counts){
  const node=document.createElement("div");node.className="analysis-card";const title=document.createElement("strong");title.textContent=report.name+"　自分 "+counts[0]+"枚 / 相手 "+counts[1]+"枚";node.append(title);
  const state=document.createElement("span");state.className=report.supported?"supported":"review";state.textContent=report.supported?"効果処理：対応済み":"効果処理：要確認（未対応の効果は実行しません）";node.append(state);
  if(report.roles.length){const roles=document.createElement("small");roles.textContent="役割の目安："+report.roles.join("・");node.append(roles);}
  for(const detail of report.details){const line=document.createElement("small");line.textContent=(detail.status==="supported"?"✓ ":"△ ")+detail.label+(detail.text?"\n"+detail.text:"");node.append(line);}el.analysisList.append(node);
}
async function analyzeDecks(decks){
  const combined=new Map();for(let side=0;side<decks.length;side++)for(const item of decks[side].cards){const entry=combined.get(item.officialCardId)||{counts:[0,0]};entry.counts[side]+=item.count;combined.set(item.officialCardId,entry);}
  const ids=[...combined.keys()],reports=[];el.analysisList.replaceChildren();el.analysisPanel.hidden=false;

  for(let index=0;index<ids.length;index++){
    const id=ids[index],report=analyzeCard(id),copies=combined.get(id).counts;reports.push(report);addAnalysisCard(report,copies);
    for(let side=0;side<2;side++)if(copies[side]){for(const role of report.roles)profiles[side].roles.add(role);if(report.type==="pokemon"&&report.bestDamage>0)profiles[side].attackerIds.push({id,damage:report.bestDamage});}
    const percent=55+40*(index+1)/ids.length;updateProgress(percent,"効果解析 "+(index+1)+"/"+ids.length+"種類");
    const elapsed=Math.max(0,Date.now()-loadStarted),remaining=index?Math.max(0,Math.ceil((elapsed/(index+1))*(ids.length-index)/1000)):null;el.elapsed.textContent="経過 "+Math.floor(elapsed/1000)+"秒・解析残り目安 "+(remaining===null?"計算中":"約"+remaining+"秒");await new Promise(resolve=>setTimeout(resolve,0));
  }
  const totalCopies=decks.reduce((sum,d)=>sum+d.cards.reduce((n,x)=>n+x.count,0),0),supportedCopies=reports.reduce((sum,r)=>sum+combined.get(r.officialCardId).counts.reduce((n,count)=>n+(r.supported?count:0),0),0);
  const totalEffects=reports.reduce((sum,r)=>sum+r.details.length,0),supportedEffects=reports.reduce((sum,r)=>sum+r.details.filter(d=>d.status==="supported").length,0),pct=totalCopies?Math.round(supportedCopies/totalCopies*100):0;
  const unresolved=reports.filter(report=>!report.supported);el.analysisSummary.textContent="カード文・効果の走査："+totalCopies+"/"+totalCopies+"枚完了（100%）。実戦対応率："+supportedCopies+"/"+totalCopies+"枚（"+pct+"%）、対応済み効果 "+supportedEffects+"/"+totalEffects+"件。未対応効果は推測で処理しません。";
  const deckNames=new Set(reports.map(report=>report.name)),plans=[];
  if(deckNames.has("メガレックウザex"))plans.push("メガレックウザex：はしゃのほうこうやヒビキのホウオウexで基本炎・雷エネルギーを場に増やし、ストームエメラルダの打点につなげる。テラパゴスexがいる場合はゼロの大空洞・ガラスのラッパも展開候補。参考：公式デッキ解説（https://www.pokemon-card.com/info/005568.html）");
  if(deckNames.has("バチンキー")&&deckNames.has("カミッチュ"))plans.push("おまつりおんど：バチンキーのドンドンだいこで必要札を探し、お祭り会場を維持。カミッチュなどのおまつりおんど持ちを育て、ワザを2回使う。参考：晴れる屋2の回し方解説（https://www.hareruya2.com/blogs/news/just-nowv4）");
  el.strategySummary.textContent=plans.length?"デッキの基本プラン（カード構成から判定）："+plans.join(" ／ "):"デッキ固有の回し方資料は未登録です。カード文と合法手に基づく基本判断で進めます。";
  for(const profile of profiles)profile.attackerIds.sort((a,b)=>b.damage-a.damage);
  return {profiles,complete:unresolved.length===0,unresolved};
}
function chooseAction(actions){
  if(!actions.length)return null;
  if(game.phase==="setup"){const player=game.setupReady[0]?1:0,firstSide=actions.filter(action=>action.player===player);if(firstSide.length)actions=firstSide;}
  let ranked=actions.map(action=>({action,value:score(action,actions)+Math.random()*0.15}));
  ranked.sort((a,b)=>b.value-a.value);
  return ranked[0].action;
}
function logAction(text){
  entries.unshift(`#${++moveCount} ${text}`);entries=entries.slice(0,12);
  el.log.replaceChildren(...entries.map(message=>{const row=document.createElement("div");row.textContent=message;return row;}));
}
function render(){
  if(!game)return;
  playerView(0);playerView(1);
  if(game.winner!=null){el.turn.textContent=`${names[game.winner]}の勝ち${game.winReason?`（${game.winReason}）`:""}`;running=false;clearTimeout(timer);timer=null;el.start.disabled=true;el.pause.disabled=true;el.load.disabled=false;setStatus(`対戦終了：${names[game.winner]}の勝ちです。`,"done");}
  else if(game.pendingKnockout?.reason){el.turn.textContent="同時きぜつ：この状態は未対応";running=false;clearTimeout(timer);timer=null;el.start.disabled=true;el.pause.disabled=true;el.load.disabled=false;setStatus("同時きぜつが発生しました。安全のため自動進行を止めました。","error");}
  else if(game.pendingBenchCleanup)el.turn.textContent="ゼロの大空洞：ベンチ上限を調整中";
  else if(game.phase==="setup")el.turn.textContent=`${game.setupReady[0]?"後攻側":"先行側"}が初期配置中`;
  else el.turn.textContent=`${game.turnNo}番目の番：${names[game.turn]}${game.pendingKnockout?" ／ きぜつ処理":game.pendingAttack?" ／ ワザ効果":game.pendingAbility?" ／ 特性効果":game.pendingTrainer?" ／ トレーナーズ効果":""}`;
  el.seed.textContent=game.seed?`シード値：${game.seed}`:"";
}
function schedule(){
  if(!running||!game)return;
  timer=setTimeout(()=>{
    timer=null;
    try{
      if(game.winner!=null){render();return;}
      const actions=engine.getMatchActions(game),action=chooseAction(actions);
      if(!action){
        running=false;el.start.disabled=true;el.pause.disabled=true;
        setStatus("エンジンから合法手がありません。未対応状態のため自動進行を停止しました。","error");render();return;
      }
      const label=describe(action);
      game=engine.applyMatchAction(game,action);
      logAction(label);render();
      if(running)schedule();
    }catch(error){
      running=false;el.start.disabled=true;el.pause.disabled=true;
      setStatus(`自動対戦を停止しました：${error.message}`,"error");render();
    }
  },delay());
}
function start(){if(!game||game.winner!=null||!analysisAllowsMatch)return;running=true;el.start.disabled=true;el.pause.disabled=false;setStatus("自動対戦中… 1手ごとに約1〜1.5秒待ちます。");schedule();}
function pause(){running=false;clearTimeout(timer);timer=null;el.start.disabled=false;el.pause.disabled=true;setStatus("一時停止中です。再開できます。");}
function startMatch(decks,analysis){
  analysisByPlayer=analysis.profiles??analysisByPlayer;analysisAllowsMatch=analysis.complete;names=decks.map(deck=>deck.name);moveCount=0;entries=[];el.log.replaceChildren();
  const seed=globalThis.crypto?.getRandomValues?globalThis.crypto.getRandomValues(new Uint32Array(1))[0]||1:Math.floor(Math.random()*0xffffffff)+1;
  game=engine.createMatch(decks.map(deck=>deck.cards.flatMap(entry=>Array(entry.count).fill(entry.officialCardId))),seed);
  el.start.disabled=!analysisAllowsMatch;el.pause.disabled=true;el.load.disabled=false;updateProgress(100,"全カード走査完了");
  const blocker=analysis.unresolved.map(report=>report.name).filter((name,index,array)=>array.indexOf(name)===index);
  if(analysisAllowsMatch){setStatus("全カードの効果対応を確認しました。スタートを押すと自動対戦します。");logAction("カード効果100%対応・対戦を準備しました");}
  else{setStatus("解析走査は100%完了。効果未対応カードが"+blocker.length+"種類あるため、対戦開始を保留中："+blocker.join("、"),"error");logAction("全カードを走査しました。未対応効果のため開始保留");}
  render();
}
el.load.onclick=async()=>{
  pause();el.load.disabled=true;el.analysisPanel.hidden=true;el.progress.hidden=false;loadStarted=Date.now();
  updateProgress(2,"読み込みを開始");setStatus("カードDBと公式デッキを確認しています…");
  clearInterval(loadClock);loadClock=setInterval(()=>{const current=Number(el.progressBar.value||0);const label=el.progressLabel.textContent.replace(/^\\d+%　/,"");updateProgress(current,label);},1000);
  try{
    if(!repository){updateProgress(8,"カードDB取得");repository=await CardRepository.load("./data/cards/cards.json");}
    updateProgress(16,"効果エンジン準備");
    if(!engine){const response=await fetch("./data/cards/ability-effects.json");if(!response.ok)throw Error("特性カタログを取得できません");engine=new MatchEngine(repository,await response.json());}
    updateProgress(24,"公式デッキ2件を取得・照合");
    const decks=await Promise.all([readDeck(el.codeA.value,"self"),readDeck(el.codeB.value,"opponent")]);
    if(decks[0].deckCode)el.codeA.value=decks[0].deckCode;if(decks[1].deckCode)el.codeB.value=decks[1].deckCode;
    updateProgress(55,"カードごとの特性・ワザ・効果を解析");const analysis=await analyzeDecks(decks);startMatch(decks,analysis);
  }catch(error){setStatus(error.message,"error");el.load.disabled=false;}
  finally{clearInterval(loadClock);loadClock=null;}
};
el.start.onclick=start;el.pause.onclick=pause;
for(const [input,slot] of [[el.codeA,"self"],[el.codeB,"opponent"]]){
  try{const saved=JSON.parse(localStorage.getItem(`pokemon-card-simulator-deck-${slot}`)||"null");if(saved?.deckCode)input.value=saved.deckCode;}catch{}
}
</script>
