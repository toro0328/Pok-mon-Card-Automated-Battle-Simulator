<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケカ通常対戦エンジン prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071526;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b1b2e;border-bottom:1px solid #35506d;padding:9px;display:flex;gap:8px;align-items:center;justify-content:space-between}button{background:#173653;color:white;border:1px solid #4c6e91;border-radius:9px;padding:8px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:8px}.player{border:1px solid #35506d;border-radius:14px;padding:8px;margin:8px 0;background:#0b1b2ecc}.opponent{transform:rotate(180deg)}.opponent .card,.opponent .meta,.opponent .label{transform:rotate(180deg)}.field{display:grid;grid-template-columns:100px 1fr 100px;gap:7px}.zone{border:1px solid #314b67;border-radius:10px;padding:5px;min-height:92px}.label{font-size:10px;color:#9eb3ca;text-align:center}.active{display:flex;justify-content:center}.bench{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}.slot{min-height:100px;border:1px dashed #557494;border-radius:8px;display:flex;align-items:center;justify-content:center}.card{width:76px;min-height:98px;border-radius:7px;padding:5px;background:#bfe5ff;color:#102033;border:2px solid white;font-size:10px;font-weight:800}.trainer{background:#ffd0d6}.energy{background:#ffe793}.meta{font-size:11px;color:#b9c8d9}.hand{display:flex;gap:4px;overflow:auto;padding:5px;min-height:108px}.prizes{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}.prize{height:38px;border-radius:5px;background:#173653;border:1px solid #557494;display:flex;align-items:center;justify-content:center}.center{text-align:center;padding:5px;color:#a9bdd2}.selected{outline:3px solid #fff;transform:translateY(-4px)}
</style></head><body>
<header><b>ポケカ通常対戦 prototype</b><div><button onclick="newGame()">初期セットアップ</button><button onclick="draw()">1枚引く</button><button onclick="endTurn()">番を終える</button></div></header>
<div class="wrap"><div id="p2"></div><div class="center" id="status"></div><div id="p1"></div></div>
<script>
const NAMES=[...Array(16)].map((_,i)=>({name:'ポケモン'+(i+1),type:'pokemon'})).concat([...Array(30)].map((_,i)=>({name:'トレーナーズ'+(i+1),type:'trainer'})),[...Array(14)].map((_,i)=>({name:'基本エネルギー',type:'energy'})));
let G,selected=null;
const clone=x=>JSON.parse(JSON.stringify(x)); const shuffle=a=>{for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function player(){let deck=shuffle(clone(NAMES));return{deck,hand:deck.splice(0,7),prizes:deck.splice(0,6),active:null,bench:Array(5).fill(null),trash:[],stadium:null,energyUsed:false}}
function newGame(){G={players:[player(),player()],turn:0,turnNo:1};selected=null;render()}
function chtml(c,pi,where,i){if(!c)return '<span class="meta">空き</span>';return '<div class="card '+c.type+(selected&&selected.pi===pi&&selected.where===where&&selected.i===i?' selected':'')+'" onclick="pick('+pi+',\''+where+'\','+i+')">'+c.name+'<br><small>'+c.type+'</small></div>'}
function pick(pi,w,i){if(pi!==G.turn)return;let p=G.players[pi],c=w==='hand'?p.hand[i]:(w==='active'?p.active:p.bench[i]);if(!c)return;if(w==='hand'&&c.type==='pokemon'){if(!p.active){p.active=p.hand.splice(i,1)[0];selected=null;render();return}let b=p.bench.indexOf(null);if(b>=0){p.bench[b]=p.hand.splice(i,1)[0];selected=null;render();return}}selected={pi,where:w,i};render()}
function view(pi){let p=G.players[pi];return '<section class="player '+(pi===1?'opponent':'')+'"><div class="meta">PLAYER '+(pi+1)+'　山札 '+p.deck.length+'　手札 '+p.hand.length+'　サイド '+p.prizes.length+'　トラッシュ '+p.trash.length+'</div><div class="field"><div class="zone"><div class="label">サイド</div><div class="prizes">'+p.prizes.map((_,i)=>'<div class="prize">'+(i+1)+'</div>').join('')+'</div></div><div class="zone"><div class="label">バトル場</div><div class="active"><div class="slot">'+chtml(p.active,pi,'active',0)+'</div></div><div class="label">ベンチ（5）</div><div class="bench">'+p.bench.map((c,i)=>'<div class="slot">'+chtml(c,pi,'bench',i)+'</div>').join('')+'</div></div><div class="zone"><div class="label">山札</div><div style="text-align:center;font-size:32px">🂠</div><div class="label">トラッシュ '+p.trash.length+'</div></div></div><div class="label">手札</div><div class="hand">'+p.hand.map((c,i)=>chtml(c,pi,'hand',i)).join('')+'</div></section>'}
function draw(){let p=G.players[G.turn];if(!p.deck.length){alert('山札切れ');return}p.hand.push(p.deck.shift());render()}
function endTurn(){G.players[G.turn].energyUsed=false;G.turn=1-G.turn;G.turnNo++;draw()}
function render(){document.getElementById('p1').innerHTML=view(0);document.getElementById('p2').innerHTML=view(1);document.getElementById('status').textContent='TURN '+G.turnNo+' / PLAYER '+(G.turn+1)+' の番　※ポケモンを手札からタップするとバトル場→ベンチへ配置'}
newGame();
</script></body></html>
