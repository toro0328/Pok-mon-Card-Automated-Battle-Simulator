<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケカ対戦試験 | 実カードDB</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#edf5ff;background:#09182b}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}
header{position:sticky;top:0;z-index:5;background:#102741;border-bottom:1px solid #405f7b;padding:9px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header b{font-size:1rem}header a{color:#b9e3ff}header button,.action{background:#1765a8;color:white;border:1px solid #87add1;border-radius:9px;padding:9px;font-weight:700;cursor:pointer}
header input{width:94px;background:#f0f7ff;border:0;border-radius:7px;padding:8px;color:#132641}
main{max-width:1100px;margin:auto;padding:10px}.notice{background:#233d59;border:1px solid #6485a4;border-radius:10px;padding:10px;font-size:.88rem;margin:6px 0 12px}
.notice a{color:#b9e3ff}
.panel{border:1px solid #395a79;border-radius:13px;background:#10263f;padding:10px;margin:10px 0}
.opponent{transform:rotate(180deg)}.opponent .card,.opponent .meta,.opponent .zone-title,.opponent .prize,.opponent .attached-summary{transform:rotate(180deg)}
.meta{font-weight:700;padding:4px;color:#c7e3fd}.field{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;gap:7px;align-items:stretch}
.zone{border:1px solid #355674;border-radius:9px;padding:5px;min-height:108px}.zone-title{font-size:.72rem;color:#a9c8e3;text-align:center}
.active,.bench{display:flex;justify-content:center;align-items:center;gap:5px}.active{min-height:105px}.bench{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:6px}
.slot{border:1px dashed #567a9a;border-radius:8px;min-width:0;min-height:95px;display:flex;align-items:center;justify-content:center}
.card{border:2px solid #e2f2ff;border-radius:8px;background:#d4effc;color:#16304b;width:min(100%,93px);min-height:88px;padding:4px;line-height:1.3;font-weight:750;font-size:.75rem;overflow-wrap:anywhere;cursor:pointer}
.card.trainer{background:#ffd3dc}.card.energy{background:#ffecae}.card.chosen{border-color:#f5b83f;box-shadow:0 0 0 3px #f5b83f}
.card small{display:block;font-weight:500;font-size:.65rem}.hand{display:flex;gap:5px;overflow:auto;min-height:100px;padding:5px}.hand .card{flex:0 0 88px}
.attached-summary{font-size:.82rem;text-align:center;color:#e5f3ff;padding:3px 0;line-height:1.45}
.prizes{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}.prize{background:#1d4b75;border:1px solid #7aa0c6;border-radius:5px;text-align:center;padding:5px;font-size:.72rem}
.damage-report{background:#60311b;border:2px solid #ffb950;border-radius:12px;padding:11px;margin:8px 0;font-weight:800;line-height:1.5}.damage-report strong{font-size:1.45rem;color:#ffdf6e}.damage-report[hidden]{display:none}
.summary{border-radius:11px;background:#16476d;padding:12px;text-align:center;line-height:1.6;font-weight:700}
.controls{margin:8px 0}.controls h2{font-size:.9rem;margin:0 0 7px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions .action{font-size:.86rem;text-align:left}
#message{min-height:1.5em;color:#ffdb7c;margin:8px 2px}
#card-menu{position:fixed;z-index:12;width:min(330px,calc(100vw - 16px));max-height:min(52vh,420px);overflow:auto;background:#183856;color:white;border:2px solid #8bc4ed;border-radius:12px;padding:10px;box-shadow:0 8px 28px #071727dd}
#card-menu[hidden]{display:none}#card-menu .menu-head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:750;margin-bottom:8px}#card-menu .menu-head button{background:#324e68;color:white;border:1px solid #88a8c3;border-radius:6px;padding:3px 8px}
#card-menu .actions{display:grid;grid-template-columns:1fr}#card-menu .action{width:100%}
.drag-card{position:fixed;z-index:20;pointer-events:none;opacity:.87;transform:translate(-50%,-50%);padding:8px;background:#ffecae;color:#16304b;border:2px solid #eda719;border-radius:8px;font-weight:700}
.hand .energy{touch-action:none}.card.drop-target{outline:3px solid #f4bc42;outline-offset:2px}
@media(max-width:650px){.field{grid-template-columns:62px minmax(0,1fr) 62px;gap:4px}.card{font-size:.66rem;min-height:78px}.card small{font-size:.56rem}.slot{min-height:84px}.zone{padding:3px}.zone-title{font-size:.61rem}.meta{font-size:.79rem}.prize{font-size:.64rem;padding:3px}}
</style>
</head>
<body>
<header><b>ポケカ対戦試験</b><a href="./ability-demo.html">特性・ワザの個別試験</a><label>シード <input id="seed" type="number" value="1" min="1" step="1"></label><button id="restart">新しい試合</button></header>
<main>
<p class="notice">自分は<a id="self-link" href="#">公式メガレックウザexデッキ</a>（60枚）、相手は<a id="opponent-link" href="#">公式のお祭り会場デッキ</a>（60枚）です。１台で両側を操作します。「おまつりおんど」「ドンドンだいこ」、お祭り会場、グロウ草エネルギーに対応しました。一部のトレーナーズに対応しました。未対応のカード効果はまだ使えません。<span id="ability-coverage"></span>手札のカードをタップすると可能な操作が表示されます。</p>
<section class="panel controls"><h2>相手の操作</h2><div class="actions" id="opponent-actions"></div></section>
<div id="opponent"></div><div class="summary" id="status">読み込み中…</div><div id="damage-report" class="damage-report" role="status" hidden></div><p id="message" role="status"></p><div id="self"></div>
<section class="panel controls"><h2>自分の操作</h2><div class="actions" id="self-actions"></div></section>
</main>
<div id="card-menu" role="dialog" aria-label="選んだカードの操作" hidden></div>
<script type="module">
import { CardRepository } from "./src/card-db/CardRepository.js";
import { MatchEngine } from "./src/engine/MatchEngine.js?v=20260925-coins1";

const ui={opponent:document.getElementById("opponent"),self:document.getElementById("self"),
  status:document.getElementById("status"),damageReport:document.getElementById("damage-report"),message:document.getElementById("message"),
  opponentActions:document.getElementById("opponent-actions"),selfActions:document.getElementById("self-actions"),
  menu:document.getElementById("card-menu"),seed:document.getElementById("seed")};
let repository,engine,game,selected=null,opponentDeck,selfDeck;
function element(tag,cls,value){const node=document.createElement(tag);if(cls)node.className=cls;if(value!==undefined)node.textContent=value;return node;}
function energySummary(instance){
  const counts=new Map();
  for(const energy of instance.attached??[]){
    const name=repository.get(energy.cardId).name;
    const type=name.match(/^基本(.+)エネルギー$/)?.[1]??name;
    counts.set(type,(counts.get(type)??0)+1);
  }
  return [...counts].map(([type,count])=>`${type}×${count}`).join(" ");
}
function startEnergyDrag(button,energy,owner){
  button.addEventListener("pointerdown",down=>{
    if(down.button!==0 || !game || game.phase!=="playing")return;
    let moved=false,ghost=null,highlight=null;
    const origin={x:down.clientX,y:down.clientY};
    button.setPointerCapture(down.pointerId);
    const targetAt=(x,y)=>document.elementFromPoint(x,y)?.closest('.card[data-zone="field"]');
    const clear=()=>{ghost?.remove();highlight?.classList.remove("drop-target");ghost=null;highlight=null;};
    const move=event=>{
      if(event.pointerId!==down.pointerId)return;
      if(!moved && Math.hypot(event.clientX-origin.x,event.clientY-origin.y)>12){
        moved=true;ghost=element("div","drag-card",repository.get(energy.cardId).name);
        document.body.append(ghost);ui.menu.hidden=true;
      }
      if(!moved)return;
      ghost.style.left=`${event.clientX}px`;ghost.style.top=`${event.clientY}px`;
      const target=targetAt(event.clientX,event.clientY);
      if(highlight!==target){highlight?.classList.remove("drop-target");highlight=target;
        if(target?.dataset.player===String(owner))target.classList.add("drop-target");}
    };
    const finish=event=>{
      if(event.pointerId!==down.pointerId)return;
      button.removeEventListener("pointermove",move);
      button.removeEventListener("pointerup",finish);
      button.removeEventListener("pointercancel",cancel);
      const target=moved&&event.type==="pointerup"?targetAt(event.clientX,event.clientY):null;
      const targetId=target?.dataset.player===String(owner)?target.dataset.instanceId:null;
      clear();
      if(!moved)return;
      button.dataset.suppressClick="true";
      setTimeout(()=>{delete button.dataset.suppressClick;},400);
      if(!targetId)return;
      const legal=engine.getMatchActions(game).find(action=>action.type==="ATTACH_ENERGY" &&
        action.player===owner && action.sourceInstanceId===energy.instanceId && action.targetInstanceId===targetId);
      if(legal)performAction(legal);
      else ui.message.textContent="今はこのポケモンにエネルギーをつけられません。";
    };
    const cancel=event=>{if(event.pointerId!==down.pointerId)return;
      button.removeEventListener("pointermove",move);button.removeEventListener("pointerup",finish);
      button.removeEventListener("pointercancel",cancel);clear();};
    button.addEventListener("pointermove",move);
    button.addEventListener("pointerup",finish);
    button.addEventListener("pointercancel",cancel);
  });
}
function cardNode(instance,owner,zoneKind){
  const data=repository.get(instance.cardId),button=element("button","card "+data.cardType+(selected===instance.instanceId?" chosen":""));
  button.dataset.instanceId=instance.instanceId;button.dataset.player=String(owner);button.dataset.zone=zoneKind;
  button.append(document.createTextNode(data.name));
  if(data.cardType==="pokemon"){
    button.append(element("small","",`HP ${engine.effectiveHP(instance)} / ダメージ ${instance.damage??0}`));
    if(instance.attached?.length){
      button.append(element("small","",`エネ：${energySummary(instance)}`));
      button.title=`ついているエネルギー：${instance.attached.map(x=>repository.get(x.cardId).name).join("、")}`;
    }
  }
  button.onclick=()=>{if(button.dataset.suppressClick)return;selected=selected===instance.instanceId?null:instance.instanceId;render();};
  if(data.cardType==="energy"&&zoneKind==="hand")startEnergyDrag(button,instance,owner);
  return button;
}
function zone(title,items,owner){
  const wrapper=element("div","");wrapper.append(element("div","zone-title",title));
  const row=element("div","hand");if(!items.length)row.append(element("span","zone-title","なし"));
  for(const item of items)row.append(cardNode(item,owner,"hand"));wrapper.append(row);return wrapper;
}
function playerView(index){
  const p=game.players[index],panel=element("section","panel"+(index===1?" opponent":""));
  panel.append(element("div","meta",`${index===0?"自分（メガレックウザex）":"相手（お祭り会場）"}　山札 ${p.deck.length}　手札 ${p.hand.length}　サイド ${p.prizes.length}　トラッシュ ${p.trash.length}`));
  const field=element("div","field"),sides=element("div","zone");
  sides.append(element("div","zone-title","サイド"));const prizes=element("div","prizes");
  p.prizes.forEach((_,i)=>prizes.append(element("span","prize",String(i+1))));sides.append(prizes);
  const middle=element("div","zone");middle.append(element("div","zone-title","バトル場"));
  const active=element("div","active");active.append(p.active?cardNode(p.active,index,"field"):element("span","zone-title","空き"));middle.append(active);
  if(p.active?.attached?.length)middle.append(element("div","attached-summary",`ついているエネルギー：${energySummary(p.active)}`));
  middle.append(element("div","zone-title","ベンチ（最大5匹）"));
  const bench=element("div","bench");for(let i=0;i<5;i++){const slot=element("div","slot");if(p.bench[i])slot.append(cardNode(p.bench[i],index,"field"));bench.append(slot);}middle.append(bench);
  const deck=element("div","zone");deck.append(element("div","zone-title","山札"),element("div","meta","🂠"),element("div","zone-title",`トラッシュ ${p.trash.length}枚`));
  field.append(sides,middle,deck);panel.append(field,zone("手札",p.hand,index));return panel;
}
function actionLabel(action){
  const player=game.players[action.player],whose=action.player===0?"自分":"相手";
  const source=[...player.hand,player.active,...player.bench].find(x=>x?.instanceId===action.sourceInstanceId);
  const target=[player.active,...player.bench].find(x=>x?.instanceId===action.targetInstanceId);
  const name=x=>x?repository.get(x.cardId).name:"";
  const choice=[...player.hand,...player.deck,...player.trash,...player.bench,...game.players[1-action.player].bench,
    ...[player.active,...player.bench].flatMap(x=>x?.attached??[])].find(x=>x?.instanceId===action.choiceInstanceId);
  switch(action.type){
    case "SET_ACTIVE":return `${whose}：${name(source)}をバトル場へ`;
    case "SET_BENCH":case "BENCH_BASIC":return `${whose}：${name(source)}をベンチへ`;
    case "READY_SETUP":return `${whose}：準備完了`;
    case "ATTACH_ENERGY":return `${whose}：${name(target)}に${name(source)}をつける`;
    case "EVOLVE":return `${whose}：${name(target)}を${name(source)}に進化`;
    case "RETREAT":return `${whose}：${name(player.active)}をにがす → ${name(target)}（エネルギー${action.paymentInstanceIds.length}枚）`;
    case "USE_ABILITY":{
      const ability=engine.entries(source)[action.abilityIndex],choice=[...player.hand,...player.deck].find(x=>x.instanceId===action.choiceInstanceId);
      return `${whose}：${name(source)}「${ability.name}」${choice?`（${name(choice)}を選ぶ）`:""}`;
    }
    case "ATTACK":return `${whose}：${name(source)}「${engine.attacks(source)[action.attackIndex].name}」${action.targetInstanceId?` → ${name([...game.players[1-action.player].bench,game.players[1-action.player].active].find(x=>x?.instanceId===action.targetInstanceId))}`:""}`;
    case "ATTACK_SEARCH":return game.pendingAttack?.destination==="BENCH"?`${whose}：山札から${name(choice)}をベンチへ`:`${whose}：山札から${name(choice)}を手札へ`;
    case "ATTACK_SEARCH_FINISH":return `${whose}：山札を切ってワザを終える`;
    case "ATTACK_DISCARD_ENERGY":return `${whose}：${game.pendingAttack?.side==="own"?"自分の":"相手の"}${name(choice)}をトラッシュ`;
    case "ATTACK_PROMOTE":return `${whose}：${name(target)}をバトル場へ`;
    case "RESOLVE_KNOCKOUT":return `${whose}：きぜつ処理を終える`;
    case "ABILITY_SELECT":return `${whose}：${name(choice)}を「${game.pendingAbility.name}」で選ぶ`;
    case "ABILITY_SKIP":return `${whose}：「${game.pendingAbility.name}」の選択を終える`;
    case "USE_HOOH":return `${whose}：${name(source)}「こんじきのほのお」→ ${name(target)}`;
    case "AKAMATSU_PICK":return `${whose}：山札から${name(choice)}を選ぶ`;
    case "AKAMATSU_HAND":return `${whose}：${name(choice)}を手札に加える`;
    case "AKAMATSU_ATTACH":return `${whose}：${name(target)}に残りのエネルギーをつける`;
    case "AKAMATSU_FINISH":return `${whose}：山札を切って終了`;
    case "PLAY_TRAINER":return `${whose}：${name(source)}を使う${choice?`（${name(choice)}を選ぶ）`:""}${target?` → ${name(target)}`:""}`;
    case "TRAINER_DISCARD":return `${whose}：${name(choice)}をトラッシュ（残り${game.pendingTrainer.costLeft}枚）`;
    case "TRAINER_SELECT":return `${whose}：山札から${name(choice)}を選ぶ`;
    case "TRAINER_FINISH":return `${whose}：選択を終えて山札を切る`;
    case "PLAY_STADIUM":return `${whose}：${name(source)}を場に出す`;
    case "TAKE_PRIZE":return `${whose}：サイド${action.prizeIndex+1}を取る`;
    case "PROMOTE_BENCH":return `${whose}：${name(source)}をバトル場へ`;
    case "END_TURN":return `${whose}：番を終える`;
  }
  return action.type;
}
function performAction(action){
  const label=actionLabel(action);
  try{game=engine.applyMatchAction(game,action);if(action.type!=="ATTACK")delete game.lastAttack;selected=null;
    ui.message.textContent=label+"を処理しました。";render();}
  catch(error){ui.message.textContent="処理を停止しました："+error.message;}
}
function actionButton(action){
  const button=element("button","action",actionLabel(action));
  button.onclick=()=>performAction(action);return button;
}
function positionMenu(){
  if(ui.menu.hidden||!selected)return;
  const anchor=[...document.querySelectorAll('.card[data-instance-id]')]
    .find(node=>node.dataset.instanceId===selected);
  if(!anchor){ui.menu.hidden=true;return;}
  const box=anchor.getBoundingClientRect(),height=ui.menu.getBoundingClientRect().height;
  ui.menu.style.left=`${Math.max(8,Math.min(box.left,window.innerWidth-ui.menu.offsetWidth-8))}px`;
  ui.menu.style.top=`${box.bottom+height+8<=window.innerHeight?box.bottom+6:Math.max(8,box.top-height-6)}px`;
}
window.addEventListener("resize",positionMenu);
window.addEventListener("scroll",()=>{if(!ui.menu.hidden)ui.menu.hidden=true;},{passive:true});
function render(){
  ui.opponent.replaceChildren(playerView(1));ui.self.replaceChildren(playerView(0));
  if(game.winner!=null)ui.status.textContent=`${game.winner===0?"自分":"相手"}の勝ち（${{PRIZES:"サイド取得",NO_POKEMON:"場のポケモンがいない",DECK_OUT:"山札切れ"}[game.winReason]??game.winReason}）`;
  else if(game.pendingKnockout?.reason)ui.status.textContent="同時きぜつ：この試験環境では処理を停止します";
  else if(game.pendingKnockout)ui.status.textContent="きぜつ処理：サイドを取り、次のバトルポケモンを選びます";
  else if(game.pendingAbility)ui.status.textContent=`${game.turn===0?"自分":"相手"}：${game.pendingAbility.name}の効果を処理中`;
  else if(game.pendingTrainer)ui.status.textContent=`${game.turn===0?"自分":"相手"}：${game.pendingTrainer.name}の効果を処理中`;
  else if(game.phase==="setup")ui.status.textContent="対戦準備：両者のたねポケモンをバトル場に置き、準備完了を押してください";
  else ui.status.textContent=`${game.turnNo}番目：${game.turn===0?"自分（先攻）":"相手（後攻）"}の番${game.turnNo===1?"・先攻1ターン目はワザを使えません":""}${game.stadium?` ／ スタジアム：${repository.get(game.stadium.cardId).name}`:""}${game.pendingSecondAttack?" ／ おまつりおんど：２回目のワザを選んでください":""}`;
  const hit=game.lastAttack;
  ui.damageReport.hidden=!hit;
  if(hit){
    const remaining=Math.max(0,hit.hp-hit.before-hit.damage);
    ui.damageReport.replaceChildren(
      element("div","",`${hit.player===0?"自分":"相手"}の${hit.attacker}「${hit.attack}」 → ${hit.defender}`),
      element("strong","",`${hit.damage} ダメージ${remaining===0?"・きぜつ！":""}`),
      element("div","",`相手の残りHP：${remaining} / ${hit.hp}${hit.coin?` ／ コイン：${hit.coin}`:""}${hit.selfDamage?` ／ 自分にも${hit.selfDamage}ダメージ`:""}`)
    );
  }
  ui.opponentActions.replaceChildren();ui.selfActions.replaceChildren();ui.menu.replaceChildren();ui.menu.hidden=true;
  const legal=engine.getMatchActions(game);
  const globalTypes=["READY_SETUP","END_TURN","TAKE_PRIZE","PROMOTE_BENCH","RESOLVE_KNOCKOUT","TRAINER_DISCARD","TRAINER_SELECT","TRAINER_FINISH","ABILITY_SELECT","ABILITY_SKIP","AKAMATSU_PICK","AKAMATSU_HAND","AKAMATSU_ATTACH","AKAMATSU_FINISH","ATTACK_SEARCH","ATTACK_SEARCH_FINISH","ATTACK_DISCARD_ENERGY","ATTACK_PROMOTE"];
  for(let player=0;player<2;player++){
    const container=player===0?ui.selfActions:ui.opponentActions;
    const common=legal.filter(action=>action.player===player&&globalTypes.includes(action.type));
    if(common.length)container.append(...common.map(actionButton));
    else container.append(element("span","zone-title",game.phase==="setup"?"カードをタップして初期配置":"場や手札のカードをタップして操作"));
  }
  let picked;
  if(selected){
    picked=game.players.flatMap(p=>[...p.hand,p.active,...p.bench]).find(x=>x?.instanceId===selected);
  }
  if(!picked)return;
  const owner=game.players.findIndex(p=>[...p.hand,p.active,...p.bench].some(x=>x?.instanceId===selected));
  const actions=legal.filter(action=>action.player===owner&&!globalTypes.includes(action.type)&&
    (action.sourceInstanceId===selected||action.targetInstanceId===selected||
      (action.type==="RETREAT"&&game.players[owner].active?.instanceId===selected)));
  const head=element("div","menu-head");head.append(element("span","",repository.get(picked.cardId).name));
  const close=element("button","","閉じる");close.onclick=()=>{selected=null;ui.menu.hidden=true;render();};head.append(close);
  ui.menu.append(head);
  if(picked.attached?.length)ui.menu.append(element("div","attached-summary",
    `ついているエネルギー：${picked.attached.map(x=>repository.get(x.cardId).name).join("、")}`));
  const chosenCard=picked&&repository.get(picked.cardId);
  const unsupportedReason=chosenCard?.cardType==="pokemon"&&engine.entries(picked).some(entry=>entry.status!=="supported")
    ?"このポケモンの特性が未対応のため、現在の対戦試験では場に出せません。"
    :chosenCard?.cardType==="trainer"&&!actions.some(x=>x.sourceInstanceId===selected)?"このトレーナーズの効果はまだ未対応です。"
    :chosenCard?.energyType==="special"&&!engine.isSupportedEnergy(picked)?"この特殊エネルギーの効果はまだ未対応です。":null;
  if(unsupportedReason&&!actions.length)ui.menu.append(element("p","",unsupportedReason));
  if(!actions.length&&!unsupportedReason)ui.menu.append(element("p","","このカードで選べる操作はありません。"));
  const list=element("div","actions");list.append(...actions.map(actionButton));ui.menu.append(list);
  ui.menu.hidden=false;positionMenu();
}
function newGame(){
  try{
    const seed=Number(ui.seed.value);if(!Number.isSafeInteger(seed)||seed<1)throw Error("シードは1以上の整数にしてください");
    game=engine.createMatch([selfDeck,opponentDeck].map(deck=>deck.cards.flatMap(entry=>Array(entry.count).fill(entry.officialCardId))),seed);selected=null;
    ui.message.textContent="自分と相手に指定の公式60枚デッキを設定しました。";render();
  }catch(error){ui.message.textContent=error.message;}
}
document.getElementById("restart").onclick=newGame;
try{
  const [loaded,response,deckResponse,selfResponse]=await Promise.all([CardRepository.load("./data/cards/cards.json"),
    fetch("./data/cards/ability-effects.json?v=20260925-coins1"),
    fetch("./data/decks/opponent-festival.json?v=20260925-coins1"),
    fetch("./data/decks/self-rayquaza.json?v=20260925-coins1")]);
  if(!response.ok||!deckResponse.ok||!selfResponse.ok)throw Error("特性カタログまたは相手デッキを取得できません");
  repository=loaded;opponentDeck=await deckResponse.json();selfDeck=await selfResponse.json();
  if(selfDeck.cards.reduce((total,entry)=>total+entry.count,0)!==60||
      selfDeck.cards.some(entry=>!repository.get(entry.officialCardId)))throw Error("自分デッキの枚数またはカードIDが不正です");
  document.getElementById("self-link").href=selfDeck.sourceUrl;
  if(opponentDeck.cards.reduce((total,entry)=>total+entry.count,0)!==60||
      opponentDeck.cards.some(entry=>!repository.get(entry.officialCardId)))throw Error("相手デッキの枚数またはカードIDが不正です");
  document.getElementById("opponent-link").href=opponentDeck.sourceUrl;
  engine=new MatchEngine(repository,await response.json());
  const abilities=opponentDeck.cards.flatMap(entry=>engine.entries({cardId:entry.officialCardId}));
  const unsupported=abilities.filter(entry=>entry.status!=="supported");
  document.getElementById("ability-coverage").textContent=unsupported.length
    ?`このデッキの未対応特性：${unsupported.map(entry=>entry.name).join("、")}。`
    :`このデッキの特性${abilities.length}件はすべて解析済みです。`;
  newGame();
}catch(error){ui.status.textContent="カードDBの読み込みに失敗しました";ui.message.textContent=error.message;}
</script>
</body>
</html>
