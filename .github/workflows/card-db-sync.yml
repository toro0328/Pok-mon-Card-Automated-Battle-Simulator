name: Card DB sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/card-db-sync.yml"
      - "scripts/import-reference-card-db.py"
      - "scripts/sync-official-cards.py"
      - "scripts/validate-card-db.py"
  workflow_dispatch:
    inputs:
      import_limit:
        description: Maximum missing cards to import
        required: false
        default: "250"
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

concurrency:
  group: card-db-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover official card IDs
        run: python scripts/sync-official-cards.py

      - name: Fetch Japanese card mirror
        run: git clone --depth 1 https://github.com/type-null/PTCG-database.git /tmp/PTCG-database

      - name: Import missing cards from mirror
        env:
          IMPORT_LIMIT: ${{ github.event_name == 'push' && '6000' || inputs.import_limit || '250' }}
        run: python scripts/import-reference-card-db.py --source-dir /tmp/PTCG-database/data_jp --limit "$IMPORT_LIMIT"

      - name: Validate database
        run: python scripts/validate-card-db.py

      - name: Compile ability effects
        run: node scripts/compile-abilities.mjs

      - name: Commit DB changes
        run: |
          git add data/cards/
          if git diff --cached --quiet; then
            echo "No card DB change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync official card database"
          git pull --rebase origin main
          git push
