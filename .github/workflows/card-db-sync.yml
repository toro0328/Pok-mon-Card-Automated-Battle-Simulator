name: Card DB sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover official card IDs
        run: python scripts/sync-official-cards.py
      - name: Import newly discovered Standard cards
        run: python scripts/import-official-cards.py --limit 50
      - name: Commit DB changes
        run: |
          if git diff --quiet; then
            echo "No card DB change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards/
          git commit -m "Sync official card database"
          git push
