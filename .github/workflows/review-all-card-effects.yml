name: Review all unresolved card effects

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find the latest completed review run
        id: previous-review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/review-all-card-effects.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty')"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
      - name: Restore the previous AI review checkpoint
        if: steps.previous-review.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: card-effect-ai-review
          run-id: ${{ steps.previous-review.outputs.run_id }}
          github-token: ${{ github.token }}
          path: reports
      - name: Build unresolved effect inventory
        run: npm run audit:cards
      - name: Add recently audited effects missing from the database snapshot
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file="reports/card-effect-audit.json";
          const audit=JSON.parse(fs.readFileSync(file,"utf8"));
          const additions=[
            {kind:"attack",name:"ガードローリング",text:"このポケモンについているエネルギーを2個選び、トラッシュする。次の相手の番、このポケモンが受けるワザのダメージは「-100」される。",officialCardIds:[46405,49082]},
            {kind:"attack",name:"フルグライト",text:"このポケモンについているエネルギーを、すべてトラッシュする。次の相手の番、相手は手札からグッズを出して使えない。",officialCardIds:[45972,46166,46176,48971]}
          ];
          const normalize=text=>String(text??"").replace(/\s+/gu," ").trim();
          const keys=new Set((audit.unresolved??[]).map(item=>`${item.kind}:${normalize(item.text)}`));
          let added=0;
          for(const effect of additions){
            const key=`${effect.kind}:${normalize(effect.text)}`;
            if(keys.has(key))continue;
            audit.unresolved.push(effect);
            keys.add(key);
            added++;
          }
          fs.writeFileSync(file,JSON.stringify(audit,null,2)+"\n");
          console.log(`Added ${added} missing effects to the AI review queue.`);
          NODE
      - name: Analyze every unique unresolved effect
        run: npm run analyze:all-effects
      - name: Save review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-effect-ai-review
          path: |
            reports/card-effect-audit.json
            reports/effect-ai-review.json
          if-no-files-found: warn
          retention-days: 90
